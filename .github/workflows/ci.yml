name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install the v2 opencode CLI
        run: npm install -g @opencode/cli@dev
      - name: Canary against the installed host
        run: bun run canary --load

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack
        run: npm pack
      - name: Verify tarball contents
        run: |
          tar -tzf subplug-*.tgz | sed 's#^package/##' | sort > pack.txt
          grep -qx 'package.json' pack.txt
          grep -qx 'server.ts' pack.txt
          grep -qx 'tui.tsx' pack.txt
          grep -qx 'src/server/index.ts' pack.txt
          grep -qx 'src/tui/index.tsx' pack.txt
          grep -qx 'README.md' pack.txt
          grep -qx 'LICENSE' pack.txt
          ! grep -q '^test/' pack.txt
          ! grep -q '^scripts/' pack.txt
          ! grep -q '^\.harness/' pack.txt
